name: Deploy (Cloudflare Pages)

# Builds and deploys main to Cloudflare Pages (free tier, works with private repos).
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID – the Cloudflare account id
# Without these secrets the deploy job is skipped (CI still runs).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      - run: npm test
        if: env.HAS_TOKEN == 'true'
      - run: npm run build
        if: env.HAS_TOKEN == 'true'
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name=personal-english-trainer --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "Cloudflare secrets not configured – deployment skipped."
